<app-logo variant="wordmark" class="h-6 flex-none" />

<div
  class="flex-1 max-w-[440px] flex items-center gap-2.5 h-[38px] px-3.5 bg-surface-2 border border-border rounded-[10px] text-text-3 focus-within:border-border-2 transition-colors"
>
  <app-icon name="search" size="md" />
  <input
    type="text"
    [value]="searchService.query()"
    (input)="onSearchInput($event)"
    placeholder="Search…"
    class="flex-1 bg-transparent outline-none text-sm text-text placeholder:text-text-3"
  />
  <span class="text-[11px] font-semibold border border-border rounded-[5px] px-1.5 py-0.5">⌘K</span>
</div>

<div class="flex-1"></div>

<app-icon-button icon="bolt" ariaLabel="Quick actions" />
<app-icon-button icon="notifications" ariaLabel="Notifications" />
