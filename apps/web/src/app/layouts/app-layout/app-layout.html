<app-sidebar />

<div class="flex-1 min-w-0 flex flex-col">
  <app-top-bar />
  <main class="flex-1 min-h-0 overflow-y-auto">
    <router-outlet />
  </main>
  <app-bottom-nav />
</div>

@if (isDevMode()) {
  <!-- TEMPORARY (Step 2 addendum) — remove once Step 10 (Settings) ships the real toggle -->
  <button
    type="button"
    aria-label="Toggle theme (dev only)"
    class="fixed bottom-4 right-4 z-50 w-11 h-11 rounded-full border border-border bg-surface text-text-2 shadow-card-lg flex items-center justify-center cursor-pointer"
    (click)="themeService.toggle()"
  >
    <app-icon [name]="themeService.theme() === 'dark' ? 'dark_mode' : 'light_mode'" size="lg" />
  </button>
}
