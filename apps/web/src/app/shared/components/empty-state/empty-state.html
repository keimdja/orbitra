<div class="text-center px-5 py-12 border-[1.5px] border-dashed border-border-2 rounded-2xl">
  <div class="w-14 h-14 rounded-2xl bg-surface-2 flex items-center justify-center mx-auto mb-3.5">
    <app-icon [name]="icon()" size="xl" class="text-text-3" />
  </div>
  <div class="text-[15px] font-bold text-text mb-1">{{ title() }}</div>
  <div class="text-[13px] text-text-3">{{ description() }}</div>
  @if (actionLabel()) {
    <div class="mt-4">
      <app-button size="sm" (clicked)="actionClicked.emit()">{{ actionLabel() }}</app-button>
    </div>
  }
</div>
