@if (label()) {
  <label [for]="textareaId" class="block text-xs font-bold text-text-2 mb-1.5">{{ label() }}</label>
}
<textarea
  [id]="textareaId"
  [value]="value()"
  [placeholder]="placeholder()"
  [rows]="rows()"
  [disabled]="disabled()"
  (input)="onInput($event)"
  class="w-full px-4 py-3 rounded-xl border border-border bg-surface-2 text-text text-[15px] font-medium leading-relaxed outline-none resize-y disabled:opacity-50 disabled:cursor-not-allowed"
></textarea>
