<div
  class="inline-flex gap-0.5 p-[3px] bg-surface-2 border border-border rounded-[10px]"
  role="tablist"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="option.value === value()"
      [class]="optionClasses(option.value)"
      (click)="select(option.value)"
    >
      @if (option.icon) {
        <app-icon [name]="option.icon" size="sm" />
      }
      {{ option.label }}
    </button>
  }
</div>
