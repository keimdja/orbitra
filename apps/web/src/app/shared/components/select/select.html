@if (label()) {
  <label [for]="selectId" class="block text-xs font-bold text-text-2 mb-1.5">{{ label() }}</label>
}
<select
  [id]="selectId"
  [value]="value()"
  [disabled]="disabled()"
  (change)="onChange($event)"
  class="h-[34px] px-2 rounded-[9px] border border-border bg-surface-2 text-text-2 text-[12.5px] font-semibold outline-none cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
>
  @for (option of options(); track option.value) {
    <option [value]="option.value">{{ option.label }}</option>
  }
</select>
