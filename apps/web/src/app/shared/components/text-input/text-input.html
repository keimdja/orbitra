@if (label()) {
  <label [for]="inputId" class="block text-xs font-bold text-text-2 mb-1.5">{{ label() }}</label>
}
<input
  [id]="inputId"
  [type]="type()"
  [value]="value()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  (input)="onInput($event)"
  class="w-full h-[46px] px-4 rounded-xl border border-border bg-surface-2 text-text text-[15px] font-medium outline-none disabled:opacity-50 disabled:cursor-not-allowed"
/>
