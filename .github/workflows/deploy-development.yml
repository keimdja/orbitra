name: Deploy Development

on:
  push:
    branches: [development]

concurrency:
  group: deploy-development
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and deploy (development)
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dev/
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production configuration, development base href)
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/dev/"

      - name: Generate 404.html fallback for client-side routing
        run: cp dist/app/browser/index.html dist/app/browser/404.html

      - name: Deploy to gh-pages (dev/ subfolder)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: apps/web/dist/app/browser
          target-folder: dev
