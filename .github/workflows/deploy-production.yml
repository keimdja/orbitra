name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and deploy (production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production configuration, production base href)
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Generate 404.html fallback for client-side routing
        run: cp dist/app/browser/index.html dist/app/browser/404.html

      - name: Deploy to gh-pages (root)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: apps/web/dist/app/browser
          # The development deployment lives in the dev/ subfolder of this same
          # branch — exclude it from the root deploy's cleanup so a production
          # deploy can never wipe out the development site.
          clean-exclude: |
            dev
